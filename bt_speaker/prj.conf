CONFIG_BT=y
CONFIG_BT_CLASSIC=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_AVDTP=y
CONFIG_BT_A2DP=y
CONFIG_BT_A2DP_SINK=y
CONFIG_BT_DEVICE_NAME="esp32_dac"
CONFIG_BT_COD=0x200404
CONFIG_BT_BUF_ACL_RX_SIZE=1300

CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
# Only to pass audio_buf.c's compile gate, no I2S driver instance is enabled
CONFIG_I2S=y
# 12 x 1920 B decoded PCM (default 50 = 96 KB, too much next to the BT controller)
CONFIG_A2DP_SBC_PCM_BUFFER_PLAY_COUNT=12
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
